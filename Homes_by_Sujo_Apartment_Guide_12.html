<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homes by Sujo — Apartment Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5E9D7;
  --cream-soft:#FBF6EC;
  --paper:#FEFCF9;
  --brown:#4E342E;
  --brown-deep:#3E2723;
  --brown-mid:#6D4C41;
  --tan:#8D6E63;
  --line:#E4D5BE;
  --line-soft:#EAD9BE;
  --white:#FFFFFF;
  --ink:#3E2723;
  --ink-soft:#6D5B52;
  --ink-faint:#9C8A7E;
  /* text-accent gold (brown family, used for labels/borders) */
  --gold:#4E342E;
  --gold-lt:#8D6E63;
  --gold-pale:#F5E9D7;
  /* true warm-gold used for glow lines / decorative accents */
  --gold-line:#C9A96E;
  --gold-glow:#CC7838;
  --good:#558B2F;
  --good-bg:#F1F8E9;
  --red:#C0392B;
  --red-bg:#FDF2F0;
  --focus:#C9A96E;
  --shadow: 0 8px 48px rgba(62,39,35,0.14), 0 2px 12px rgba(62,39,35,0.08);
  --shadow-sm: 0 2px 12px rgba(62,39,35,0.08);
  --shadow-md: 0 8px 28px rgba(62,39,35,0.12);
  --shadow-lg: 0 16px 48px rgba(62,39,35,0.20);
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --font-serif:'DM Serif Display', Georgia, 'Times New Roman', serif;
  --font-sans:'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-sans);
  text-transform:capitalize;
  font-size:16px;
  line-height:1.5;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button, input, select, textarea, ::placeholder{
  text-transform:capitalize;
}
img{max-width:100%;}
a{color:inherit;}
button{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--font-serif);font-weight:400;color:var(--brown-deep);margin:0;}
p{margin:0;}
ul{list-style:none;margin:0;padding:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
}
@keyframes fadeUp{ from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
@keyframes slideInRow{ from{opacity:0;transform:translateX(-16px);} to{opacity:1;transform:translateX(0);} }

/* ---------- layout shell ---------- */
.skip-link{position:absolute;left:-999px;top:0;background:var(--brown-deep);color:var(--cream);padding:10px 16px;border-radius:0 0 8px 0;z-index:200;}
.skip-link:focus{left:0;}

header.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(59,34,24,0.98);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:var(--cream);
  border-bottom:1px solid rgba(245,233,215,0.15);
}
.topbar-inner{
  max-width:1180px;margin:0 auto;padding:11px 24px;
  display:flex;align-items:center;gap:18px;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none;cursor:pointer;background:none;border:none;padding:0;}
.brand svg{width:30px;height:30px;flex-shrink:0;background:rgba(245,233,215,0.12);border-radius:8px;padding:4px;}
.brand-text{font-family:var(--font-serif);font-size:1.15rem;color:var(--cream);white-space:nowrap;letter-spacing:.2px;}
.brand-text em{font-style:italic;opacity:.65;font-family:var(--font-serif);font-size:.9em;}

.global-search{
  flex:1;display:flex;align-items:center;gap:10px;
  background:rgba(245,233,215,0.08);
  border:1px solid rgba(245,233,215,0.18);
  border-radius:999px;padding:9px 16px;
  transition:background .15s, border-color .15s;
}
.global-search:focus-within{background:rgba(245,233,215,0.16);border-color:rgba(201,169,110,0.6);}
.global-search svg{width:17px;height:17px;opacity:.6;flex-shrink:0;}
.global-search input{
  background:none;border:none;color:var(--cream);font-size:0.94rem;flex:1;min-width:0;
  font-family:var(--font-sans);
}
.global-search input::placeholder{color:rgba(245,233,215,0.5);}
.global-search input:focus{outline:none;}
.search-clear{
  background:none;border:none;color:rgba(245,233,215,.75);cursor:pointer;padding:2px;line-height:0;flex-shrink:0;
  border-radius:50%;
}
.search-clear:hover{color:var(--cream);}

.topbar-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.icon-btn{
  display:inline-flex;align-items:center;gap:7px;
  background:none;
  border:none;
  color:rgba(245,233,215,0.65);
  padding:8px 14px;border-radius:999px;
  cursor:pointer;font-size:0.78rem;font-weight:600;letter-spacing:.08em;text-transform:capitalize;
  white-space:nowrap;
  transition:all .2s;
}
.icon-btn:hover{background:rgba(245,233,215,0.12);color:var(--cream);}
.icon-btn svg{width:15px;height:15px;flex-shrink:0;}
.icon-btn .count-badge{
  background:var(--gold-line);color:var(--brown-deep);
  border-radius:999px;font-size:.7rem;font-weight:700;
  min-width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;
  letter-spacing:0;text-transform:none;
}
.icon-btn .count-badge[hidden]{display:none;}

main{max-width:1180px;margin:0 auto;padding:0 20px 90px;}

/* ---------- HOME HERO (dark, gold-accented) ---------- */
.home-hero{
  background:linear-gradient(160deg, #3E2220 0%, #5C3428 55%, #4A2C24 100%);
  padding:40px 44px 44px;position:relative;overflow:hidden;
  margin:28px 0 0;border-radius:26px 26px 0 0;
  animation:fadeUp .6s cubic-bezier(.22,.68,0,1.2) both;
}
.home-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 80% 30%, rgba(201,169,110,0.10) 0%, transparent 60%);
  pointer-events:none;
}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;position:relative;z-index:1;}
.hero-logo-row{display:flex;align-items:center;gap:13px;}
.hero-logo-box{
  width:52px;height:52px;border-radius:13px;background:var(--cream);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 12px rgba(0,0,0,0.2);
}
.hero-logo-box svg{width:38px;height:38px;color:var(--brown);}
.hero-brand-text{font-family:var(--font-serif);font-size:1.3rem;color:var(--cream);letter-spacing:-.3px;line-height:1;}
.hero-brand-text em{font-style:italic;color:rgba(245,233,215,0.65);}
.hero-doc-tag{text-align:right;}
.hero-doc-tag-pill{
  display:inline-block;border:1px solid rgba(245,233,215,0.22);
  color:rgba(245,233,215,0.72);font-size:.62rem;font-weight:700;letter-spacing:.15em;text-transform:capitalize;
  padding:6px 15px;border-radius:20px;background:rgba(245,233,215,0.06);margin-bottom:5px;
}
.hero-doc-tagline{display:block;font-size:.62rem;font-style:italic;color:rgba(245,233,215,0.4);letter-spacing:.03em;}
.hero-gold-line{
  height:1px;margin-bottom:28px;position:relative;z-index:1;
  background:linear-gradient(90deg, rgba(201,169,110,0.55), rgba(201,169,110,0.15) 60%, transparent);
}
.hero-mid{display:flex;align-items:flex-start;gap:40px;position:relative;z-index:1;flex-wrap:wrap;}
.hero-left{flex:1;min-width:260px;}
.hero-eyebrow{
  display:flex;align-items:center;gap:10px;font-size:.62rem;font-weight:700;letter-spacing:.22em;
  color:rgba(245,233,215,0.45);text-transform:capitalize;margin-bottom:14px;
}
.hero-eyebrow::before{content:'';display:block;width:26px;height:1px;background:rgba(201,169,110,0.6);flex-shrink:0;}
.hero-title{
  font-family:var(--font-serif);font-size:clamp(1.9rem,4vw,2.7rem);color:var(--cream);
  letter-spacing:-1px;line-height:1.1;margin-bottom:14px;
}
.hero-title em{font-style:italic;color:rgba(245,233,215,0.62);}
.hero-subtitle{font-size:.92rem;color:rgba(245,233,215,0.52);line-height:1.65;max-width:440px;font-weight:300;}
.hero-right{flex-shrink:0;width:220px;}
.hero-stat-row{background:rgba(0,0,0,0.22);border:1px solid rgba(245,233,215,0.10);border-radius:16px;overflow:hidden;}
.hero-stat{padding:15px 20px;border-bottom:1px solid rgba(245,233,215,0.07);}
.hero-stat:last-child{border-bottom:none;}
.hero-stat-label{font-size:.55rem;font-weight:700;letter-spacing:.18em;color:rgba(245,233,215,0.4);text-transform:capitalize;margin-bottom:4px;}
.hero-stat-value{font-family:var(--font-serif);font-size:1.6rem;color:var(--cream);letter-spacing:-.5px;line-height:1;margin-bottom:2px;}
.hero-stat-sub{font-size:.68rem;color:rgba(245,233,215,0.32);}

/* ---------- PAGE (cream-white content card) ---------- */
.page-panel{
  background:var(--paper);border-radius:0 0 26px 26px;box-shadow:var(--shadow);
  animation:fadeUp .6s cubic-bezier(.22,.68,0,1.2) .08s both;
  padding:36px 40px 44px;
}

/* ---------- filter bar ---------- */
.filter-bar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin:0 0 30px;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--white);border:1.5px solid var(--line);
  color:var(--brown);
  padding:8px 15px;border-radius:999px;font-size:0.82rem;font-weight:500;
  cursor:pointer;transition:all .18s;
  user-select:none;
}
.chip:hover{border-color:var(--gold-line);}
.chip.active{background:var(--gold);border-color:var(--gold);color:var(--cream);box-shadow:0 2px 8px rgba(78,52,46,0.25);}
.chip .chip-x{opacity:.7;}
.reset-btn{
  background:none;border:none;color:var(--ink-soft);text-decoration:underline;
  font-size:0.85rem;cursor:pointer;padding:8px 6px;
}
.reset-btn:hover{color:var(--brown-deep);}
.result-count{color:var(--ink-faint);font-size:.82rem;margin-left:auto;padding:8px 0;white-space:nowrap;}

/* ---------- sections ---------- */
.section{margin-bottom:30px;}
.section-title{
  display:flex;align-items:baseline;gap:10px;margin-bottom:14px;
}
.section-title h2{font-size:1.15rem;}
.section-title .sub{color:var(--ink-faint);font-size:.82rem;}

.strip{
  display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;
  scrollbar-width:thin;
}
.strip::-webkit-scrollbar{height:6px;}
.strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

/* ---------- apartment grid & cards ---------- */
.building-group{margin-bottom:30px;}
.building-head.phase-label{
  display:flex;align-items:baseline;gap:10px;
  font-family:var(--font-serif);font-size:1.05rem;color:var(--gold);
  margin:0 0 14px;padding:9px 18px;
  background:var(--gold-pale);border-left:4px solid var(--gold-line);
  border-radius:0 10px 10px 0;letter-spacing:.2px;
}
.building-head.phase-label h2{color:inherit;font-family:inherit;font-size:inherit;margin:0;}
.building-head .count{color:var(--ink-faint);font-size:.78rem;font-family:var(--font-sans);}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;
}

.card{
  background:var(--white);
  border-radius:16px;
  border:1px solid var(--line-soft);
  border-top:3px solid var(--gold-line);
  box-shadow:0 2px 14px rgba(78,52,46,0.06);
  padding:18px;
  display:flex;flex-direction:column;gap:8px;
  text-decoration:none;color:inherit;
  position:relative;
  cursor:pointer;
  transition:transform .22s, box-shadow .22s;
  min-width:200px;
}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(78,52,46,0.16);}
.card:focus-visible{transform:translateY(-4px);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card-title{font-family:var(--font-serif);font-size:1.4rem;font-weight:700;color:var(--brown-deep);line-height:1.2;}
.card-building{font-size:.68rem;color:var(--gold);font-weight:700;text-transform:capitalize;letter-spacing:.09em;margin-bottom:2px;}
.card-overview{font-size:.85rem;color:var(--ink-soft);line-height:1.5;font-weight:400;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:8px;}
.tag-pill{
  background:var(--gold-pale);color:var(--brown-mid);
  font-size:.68rem;font-weight:600;padding:3px 10px;border-radius:999px;
  border:1px solid rgba(78,52,46,0.12);
}
.fav-btn{
  background:none;border:none;cursor:pointer;padding:4px;color:var(--ink-faint);flex-shrink:0;
  border-radius:8px;line-height:0;transition:color .15s;
}
.fav-btn:hover{color:var(--gold-glow);}
.fav-btn.active{color:var(--gold-glow);}
.fav-btn svg{width:20px;height:20px;}

.compare-check{
  position:absolute;top:12px;right:12px;
  display:flex;align-items:center;gap:5px;
  background:var(--white);border:1.5px solid var(--line);border-radius:999px;
  padding:4px 9px 4px 7px;font-size:.68rem;font-weight:600;color:var(--ink-soft);
  cursor:pointer;
}
.compare-check.active{background:var(--gold);border-color:var(--gold);color:var(--cream);}

.mini-card{
  flex:0 0 auto;width:190px;
  background:var(--white);border:1px solid var(--line-soft);border-top:3px solid var(--gold-line);border-radius:16px;
  padding:13px 15px;cursor:pointer;text-decoration:none;color:inherit;
  box-shadow:0 2px 14px rgba(78,52,46,0.06);transition:transform .2s, box-shadow .2s;
}
.mini-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(78,52,46,0.14);}
.mini-card .card-building{margin-bottom:1px;}
.mini-card .card-title{font-size:1.1rem;}

/* ---------- no results ---------- */
.no-results{
  text-align:center;padding:60px 20px;color:var(--ink-soft);
}
.no-results svg{width:52px;height:52px;color:var(--line);margin-bottom:14px;}
.no-results h3{margin-bottom:6px;color:var(--brown-deep);}
.no-results .reset-btn{font-size:1rem;margin-top:10px;}

/* ---------- apartment detail ---------- */
.back-row{padding:18px 0 0;max-width:1180px;margin:0 auto;}
.back-link{
  display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--brown-mid);
  cursor:pointer;font-size:.88rem;font-weight:600;padding:6px 4px;letter-spacing:.02em;
}
.back-link:hover{color:var(--gold-glow);}
.back-link svg{width:15px;height:15px;}

.detail-hero{
  background:linear-gradient(160deg, #3E2220 0%, #5C3428 55%, #4A2C24 100%);
  color:var(--cream);border-radius:26px 26px 0 0;
  padding:34px 40px 38px;
  display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-start;
  position:relative;overflow:hidden;
  animation:fadeUp .5s cubic-bezier(.22,.68,0,1.2) both;
}
.detail-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 80% 20%, rgba(201,169,110,0.10) 0%, transparent 60%);
  pointer-events:none;
}
.detail-hero-main{flex:1;min-width:240px;position:relative;z-index:1;}
.detail-building{
  display:flex;align-items:center;gap:10px;
  font-size:.62rem;font-weight:700;text-transform:capitalize;letter-spacing:.22em;color:rgba(245,233,215,0.5);margin-bottom:12px;
}
.detail-building::before{content:'';display:block;width:26px;height:1px;background:rgba(201,169,110,0.6);flex-shrink:0;}
.detail-hero h1{color:var(--cream);font-size:clamp(1.9rem,3.4vw,2.5rem);margin-bottom:12px;letter-spacing:-.5px;}
.detail-overview{color:rgba(245,233,215,0.62);max-width:56ch;font-size:.92rem;line-height:1.65;font-weight:300;}
.detail-quickfacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.qf-pill{
  background:rgba(245,233,215,0.10);border:1px solid rgba(245,233,215,0.22);
  padding:6px 14px;border-radius:999px;font-size:.78rem;font-weight:700;text-transform:capitalize;letter-spacing:.03em;
}
.detail-actions{display:flex;flex-direction:column;gap:10px;align-items:flex-end;position:relative;z-index:1;}
.airbnb-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--gold-line);color:var(--brown-deep);
  padding:13px 24px;border-radius:999px;font-weight:700;font-size:.92rem;
  text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,0.18);white-space:nowrap;
  transition:transform .15s, box-shadow .15s;
}
.airbnb-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,0.24);}
.airbnb-btn svg{width:16px;height:16px;}
.hero-secondary{display:flex;gap:8px;}
.ghost-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(245,233,215,0.08);border:1px solid rgba(245,233,215,0.25);color:var(--cream);
  padding:9px 14px;border-radius:999px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;
}
.ghost-btn:hover{background:rgba(245,233,215,0.18);}
.ghost-btn svg{width:14px;height:14px;}
.ghost-btn.on{background:var(--cream);color:var(--brown-deep);border-color:var(--cream);}

.detail-page-panel{
  background:var(--paper);border-radius:0 0 26px 26px;box-shadow:var(--shadow);
  padding:36px 40px 40px;
}
.detail-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;
}
.panel{
  background:var(--white);border:1px solid var(--line-soft);border-radius:16px;
  padding:22px 22px;box-shadow:0 2px 14px rgba(78,52,46,0.05);
  transition:transform .2s, box-shadow .2s, border-color .2s;
}
.panel:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(78,52,46,0.10);border-color:var(--gold-line);}
.panel.wide{grid-column:1 / -1;}
.panel h3{
  font-size:1.08rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:12px;
  color:var(--brown-deep);font-family:var(--font-sans);text-transform:capitalize;letter-spacing:.035em;
}
.panel h3 .icon-box{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:var(--gold-pale);border:1px solid rgba(78,52,46,0.15);
  display:flex;align-items:center;justify-content:center;
}
.panel h3 svg{width:18px;height:18px;color:var(--gold);flex-shrink:0;}
.feat-list{display:flex;flex-direction:column;gap:14px;}
.feat-item{
  display:flex;align-items:flex-start;gap:10px;font-size:.96rem;color:var(--ink);line-height:1.55;font-weight:500;
}
.feat-item::before{
  content:"";width:7px;height:7px;border-radius:50%;background:var(--gold-line);margin-top:8px;flex-shrink:0;
}
.feat-main{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
.feat-text-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
.feat-text{font-weight:700;color:var(--brown-deep);}
.feat-item .info-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--white);color:var(--gold);cursor:pointer;flex-shrink:0;
  border-radius:999px;font-size:.68rem;font-weight:800;text-transform:capitalize;letter-spacing:.04em;
  border:1.4px solid var(--gold-line);padding:4px 10px 4px 8px;transition:all .15s;white-space:nowrap;
}
.feat-item .info-btn svg{width:11px;height:11px;flex-shrink:0;}
.feat-item .info-btn:hover{background:var(--gold);color:var(--white);border-color:var(--gold);}
.feat-explain{
  font-size:.86rem;color:var(--brown-deep);background:var(--gold-pale);border-radius:9px;
  padding:8px 12px;line-height:1.55;font-weight:500;border-left:3px solid var(--gold-line);
}
.feat-explain-label{
  text-transform:capitalize;font-weight:800;letter-spacing:.06em;color:var(--gold);
  margin-right:7px;font-size:.68rem;
}
.tv-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.tv-slot{background:var(--gold-pale);border-radius:12px;padding:13px 15px;}
.tv-slot .tv-label{font-size:.7rem;text-transform:capitalize;letter-spacing:.1em;color:var(--gold-lt);margin-bottom:5px;font-weight:800;}
.tv-slot .tv-value{font-size:1.08rem;color:var(--brown-deep);font-weight:800;}
.tv-slot.empty .tv-value{color:var(--ink-faint);font-weight:500;font-style:italic;font-size:.85rem;text-transform:none;}

.notice-box{
  background:var(--white);border:1.5px solid rgba(78,52,46,0.2);border-left:4px solid var(--gold-line);
  border-radius:12px;
  padding:13px 16px;font-size:.92rem;color:var(--ink);display:flex;gap:10px;align-items:flex-start;
  margin-top:10px;box-shadow:0 2px 10px rgba(78,52,46,0.06);font-weight:500;
}
.notice-box strong{text-transform:capitalize;letter-spacing:.03em;font-weight:800;}
.notice-box svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--gold);}
.notice-box.warn{background:var(--gold-pale);border-color:rgba(168,92,40,0.35);color:var(--brown-deep);}
.notice-box.warn svg{color:#8A6A2A;}
.notice-box.exception{background:var(--red-bg);border-left-color:var(--red);color:#7A1515;}
.notice-box.exception svg{color:var(--red);}

.chips-inline{display:flex;flex-wrap:wrap;gap:7px;}
.chips-inline .tag-pill{font-size:.76rem;}

/* ---------- info popover (template-card style) ---------- */
.popover-backdrop{position:fixed;inset:0;background:rgba(62,39,35,0.35);z-index:150;}
.popover{
  position:fixed;z-index:151;background:var(--white);border-radius:16px;
  box-shadow:var(--shadow-lg);max-width:340px;
  border:1.5px solid var(--line-soft);overflow:hidden;
}
.popover-head{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;}
.popover-icon{width:36px;height:36px;border-radius:10px;background:var(--gold-pale);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-style:italic;font-weight:700;color:var(--gold);}
.popover h4{font-size:1rem;margin-bottom:1px;}
.popover .kind{color:var(--gold-lt);font-size:.66rem;text-transform:capitalize;letter-spacing:.1em;font-weight:700;}
.popover-msg{
  background:var(--gold-pale);border-top:1px solid var(--line-soft);
  padding:13px 18px 15px;font-size:.86rem;color:var(--brown-deep);line-height:1.6;font-style:italic;
}
.popover-msg .ex{display:block;margin-top:8px;color:var(--brown-mid);}
.popover-msg .caveat{display:block;margin-top:8px;font-style:normal;color:var(--ink-soft);font-size:.82rem;}
.popover-msg a{color:var(--brown-mid);font-style:normal;}
.popover .close-x{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:5px;border-radius:50%;}
.popover .close-x:hover{background:rgba(78,52,46,0.08);}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--brown-deep);color:var(--cream);padding:12px 22px;border-radius:999px;
  font-size:.88rem;font-weight:600;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;
  z-index:300;display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast svg{width:16px;height:16px;color:var(--good);}

/* ---------- compare bar & view ---------- */
.compare-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:rgba(59,34,24,0.98);color:var(--cream);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid rgba(245,233,215,0.15);
  padding:12px 20px;display:flex;align-items:center;gap:16px;
}
.compare-bar-inner{max-width:1180px;margin:0 auto;width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.compare-slots{display:flex;gap:8px;flex:1;flex-wrap:wrap;}
.compare-slot{
  background:rgba(245,233,215,0.1);border:1px solid rgba(245,233,215,0.22);border-radius:999px;
  padding:6px 8px 6px 14px;font-size:.82rem;display:flex;align-items:center;gap:8px;
}
.compare-slot button{background:none;border:none;color:var(--cream);opacity:.7;cursor:pointer;padding:2px;}
.compare-slot button:hover{opacity:1;}
.compare-cta{
  background:var(--gold-line);color:var(--brown-deep);border:none;padding:10px 20px;border-radius:999px;
  font-weight:700;cursor:pointer;font-size:.88rem;white-space:nowrap;transition:transform .15s;
}
.compare-cta:hover:not(:disabled){transform:translateY(-1px);}
.compare-cta:disabled{opacity:.4;cursor:not-allowed;}
.compare-cancel{background:none;border:none;color:rgba(245,233,215,.7);cursor:pointer;font-size:.82rem;text-decoration:underline;}

.compare-table-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line-soft);background:var(--white);box-shadow:0 2px 14px rgba(78,52,46,0.06);}
table.compare-table{width:100%;border-collapse:collapse;font-size:.87rem;min-width:560px;}
table.compare-table th, table.compare-table td{
  padding:14px 18px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top;
}
table.compare-table th{background:var(--gold-pale);font-family:var(--font-serif);font-weight:400;font-size:1.1rem;color:var(--brown-deep);position:sticky;top:0;border-bottom:2px solid var(--gold-line);}
table.compare-table .row-label{font-weight:700;color:var(--gold);background:var(--gold-pale);white-space:nowrap;font-size:.72rem;text-transform:capitalize;letter-spacing:.08em;}
table.compare-table tr.diff td{background:#FBF3E7;}
table.compare-table tr:hover td{background:var(--cream-soft);}
table.compare-table tr.diff:hover td{background:#F7ECD8;}
table.compare-table td ul{padding-left:0;}
table.compare-table td li{margin-bottom:4px;}

/* ---------- glossary modal (template-card style) ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(62,39,35,0.45);z-index:180;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.modal{
  background:var(--paper);border-radius:22px;max-width:640px;width:100%;
  box-shadow:var(--shadow-lg);padding:28px 28px 32px;position:relative;
}
.modal-head{margin-bottom:4px;}
.modal-head h2{font-size:1.55rem;}
.modal-close{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:6px;border-radius:50%;}
.modal-close:hover{background:rgba(78,52,46,0.08);color:var(--brown-deep);}
.modal p.lead{color:var(--ink-soft);font-size:.88rem;margin-bottom:18px;font-weight:300;}
.glossary-search{
  display:flex;align-items:center;gap:8px;background:var(--white);border:1.5px solid var(--line-soft);
  border-radius:999px;padding:9px 16px;margin-bottom:18px;
}
.glossary-search svg{width:15px;height:15px;color:var(--ink-faint);}
.glossary-search input{border:none;background:none;flex:1;font-size:.9rem;font-family:inherit;color:var(--ink);}
.glossary-search input:focus{outline:none;}
.glossary-list{display:flex;flex-direction:column;gap:14px;max-height:56vh;overflow-y:auto;padding-right:4px;}
.gloss-entry{
  border:1.5px solid var(--line-soft);border-radius:14px;overflow:hidden;background:var(--white);
  position:relative;flex-shrink:0;
}
.gloss-entry::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold-line);}
.gloss-head{padding:13px 16px 10px 20px;}
.gloss-entry h4{font-size:.98rem;margin-bottom:1px;}
.gloss-entry .kind{color:var(--gold-lt);font-size:.64rem;text-transform:capitalize;font-weight:700;letter-spacing:.1em;}
.gloss-body{background:var(--gold-pale);border-top:1px solid var(--line-soft);padding:11px 16px 13px 20px;font-size:.85rem;color:var(--brown-deep);line-height:1.55;font-style:italic;}

/* ---------- closing footer ---------- */
.closing{
  background:linear-gradient(145deg, #3B2218 0%, #5C3728 55%, #4A2C22 100%);
  border-radius:0 0 26px 26px;padding:48px 40px 46px;
  text-align:center;position:relative;overflow:hidden;
}
.closing-eyebrow{
  font-size:.62rem;font-weight:600;letter-spacing:.2em;color:rgba(245,233,215,0.6);
  text-transform:capitalize;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:10px;
}
.closing-eyebrow::before, .closing-eyebrow::after{content:'';display:block;width:22px;height:1px;background:rgba(245,233,215,0.4);}
.closing-title{font-family:var(--font-serif);font-size:1.7rem;color:var(--cream);margin-bottom:12px;letter-spacing:-.5px;}
.closing-body{font-size:.86rem;color:rgba(245,233,215,0.6);line-height:1.7;max-width:460px;margin:0 auto 24px;font-weight:300;}
.closing-brand{
  display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  background:rgba(245,233,215,0.1);border:1.5px solid rgba(245,233,215,0.22);
  border-radius:100px;padding:10px 22px;font-size:.78rem;font-weight:600;color:var(--cream);letter-spacing:.02em;
}
.closing-brand svg{width:18px;height:18px;color:var(--brown);}
.closing-brand .accent{color:var(--gold-line);}

/* ---------- utility ---------- */
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.empty-hint{color:var(--ink-faint);font-size:.88rem;padding:6px 2px;}

@media (max-width:760px){
  .topbar-inner{flex-wrap:wrap;padding:10px 16px;}
  .brand{order:1;}
  .topbar-actions{order:2;margin-left:auto;}
  .global-search{order:3;flex-basis:100%;}
  .icon-btn span.label-text{display:none;}

  .home-hero{padding:26px 22px 28px;margin:0;border-radius:0;}
  .hero-top{flex-direction:column;align-items:flex-start;gap:12px;}
  .hero-doc-tag{text-align:left;}
  .hero-doc-tagline{text-align:left;}
  .hero-logo-box{width:44px;height:44px;border-radius:11px;}
  .hero-logo-box svg{width:32px;height:32px;}
  .hero-brand-text{font-size:1.05rem;}
  .hero-mid{flex-direction:column;gap:20px;}
  .hero-right{width:100%;}
  .hero-stat-row{display:flex;}
  .hero-stat{flex:1;border-bottom:none;border-right:1px solid rgba(245,233,215,0.07);}
  .hero-stat:last-child{border-right:none;}

  .page-panel, .detail-page-panel{padding:26px 18px 32px;border-radius:0;}

  .detail-hero{flex-direction:column;padding:26px 20px 30px;border-radius:0;}
  .detail-actions{align-items:stretch;width:100%;}
  .airbnb-btn{justify-content:center;}
  .hero-secondary{justify-content:stretch;flex-wrap:wrap;}
  .hero-secondary .ghost-btn{flex:1 1 100%;justify-content:center;white-space:nowrap;}
  .tv-pair{grid-template-columns:1fr;}

  .closing{padding:36px 20px 34px;border-radius:0;}
  .closing-title{font-size:1.4rem;}

  .back-row{padding:14px 16px 0;}
}
</style>
</head>

<script>
/* ============================================================
   Homes by Sujo — Co-Host Apartment Guide
   PRESENTATION / BEHAVIOUR — reads from window.HBS_DATA (data.js).
   No apartment facts are hard-coded here.
   ============================================================ */
(function () {
  "use strict";

  var DATA = window.HBS_DATA;
  var APARTMENTS = DATA.apartments;
  var BUILDINGS = DATA.buildings;
  var GLOSSARY = DATA.glossary;

  var BUILDING_BY_ID = {};
  BUILDINGS.forEach(function (b) { BUILDING_BY_ID[b.id] = b; });
  var APT_BY_ID = {};
  APARTMENTS.forEach(function (a) { APT_BY_ID[a.id] = a; });

  /* ---------------- storage helpers (guarded) ---------------- */
  function storageGet(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch (e) { return fallback; }
  }
  function storageSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* ignore */ }
  }
  function sessionGet(key, fallback) {
    try {
      var v = sessionStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch (e) { return fallback; }
  }
  function sessionSet(key, val) {
    try { sessionStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* ignore */ }
  }

  var favourites = storageGet("hbs_favourites", []);
  var recents = storageGet("hbs_recents", []);
  var compareList = storageGet("hbs_compare", []);

  function saveFavourites() { storageSet("hbs_favourites", favourites); }
  function saveRecents() { storageSet("hbs_recents", recents); }
  function saveCompare() { storageSet("hbs_compare", compareList); }

  function toggleFavourite(id) {
    var i = favourites.indexOf(id);
    if (i === -1) favourites.unshift(id); else favourites.splice(i, 1);
    saveFavourites();
  }
  function isFavourite(id) { return favourites.indexOf(id) !== -1; }

  function pushRecent(id) {
    var i = recents.indexOf(id);
    if (i !== -1) recents.splice(i, 1);
    recents.unshift(id);
    recents = recents.slice(0, 8);
    saveRecents();
  }

  function toggleCompare(id) {
    var i = compareList.indexOf(id);
    if (i !== -1) { compareList.splice(i, 1); }
    else {
      if (compareList.length >= 3) compareList.shift();
      compareList.push(id);
    }
    saveCompare();
    renderCompareBar();
  }
  function isInCompare(id) { return compareList.indexOf(id) !== -1; }

  /* ---------------- search index ---------------- */
  var SYNONYM_TRIGGERS = [
    { rx: /nespresso|espresso/i, add: ["coffee", "coffeemachine"] },
    { rx: /ps5/i, add: ["playstation", "gaming", "console", "game"] },
    { rx: /sonos/i, add: ["speaker", "music"] },
    { rx: /philips hue/i, add: ["lighting", "mood", "ambient"] },
    { rx: /vranjes/i, add: ["diffuser", "fragrance", "scent"] },
    { rx: /air purifier/i, add: ["purifier", "airquality"] },
    { rx: /\bpool\b/i, add: ["swimming"] },
    { rx: /\bgym\b/i, add: ["fitness"] },
    { rx: /dolby atmos|atmos/i, add: ["surroundsound", "cinema"] },
    { rx: /q-symphony/i, add: ["qsymphony"] },
    { rx: /balcony|terrace/i, add: ["outdoor"] },
    { rx: /concierge|airport transfer/i, add: ["transfers"] }
  ];

  function tokenize(str) {
    return (str.toLowerCase().match(/[a-z0-9]+/g) || []);
  }

  function buildSearchable(apt) {
    var b = BUILDING_BY_ID[apt.buildingId];
    // Identity text (building + number) is always trusted as this apartment's own.
    var identityText = b.name + " " + apt.number;
    // Content text can legitimately reference a *different* tower in a shared
    // note (e.g. "confirmed for every Tower 60 and Tower 62 apartment") — strip
    // those cross-references so a "60 1601" search can't cross-match 62's 1601.
    var contentTextRaw = [
      apt.overview,
      (apt.quickFacts || []).join(" "),
      apt.checkIn || "",
      apt.tv ? (apt.tv.livingRoom || "") + " " + (apt.tv.bedroom || "") : "",
      (apt.entertainment || []).join(" "),
      (apt.kitchenCoffee || []).join(" "),
      (apt.bedroomBathroomLaundry || []).join(" "),
      (apt.lightingComfort || []).join(" "),
      (apt.buildingFacilities || []).join(" "),
      (apt.servicesIncluded || []).join(" "),
      (apt.guestNotes || []).join(" ")
    ].join(" ");
    var contentText = contentTextRaw.replace(/tower\s*6[02]\b/gi, " ");

    var positiveParts = identityText + " " + contentText;

    // Amenity-only text for badges/filters: guest notes and service exceptions
    // carry policy language (e.g. a smoking note mentioning "the balcony
    // window", or a note that a service is NOT provided) that must not be
    // read as confirming an actual apartment amenity.
    var amenityTextRaw = [
      apt.overview,
      (apt.quickFacts || []).join(" "),
      apt.tv ? (apt.tv.livingRoom || "") + " " + (apt.tv.bedroom || "") : "",
      (apt.entertainment || []).join(" "),
      (apt.kitchenCoffee || []).join(" "),
      (apt.bedroomBathroomLaundry || []).join(" "),
      (apt.lightingComfort || []).join(" "),
      (apt.buildingFacilities || []).join(" "),
      (apt.servicesIncluded || []).join(" ")
    ].join(" ").replace(/tower\s*6[02]\b/gi, " ");
    var amenityRaw = (identityText + " " + amenityTextRaw).toLowerCase();

    // Airport taxi/transfer signal: only a guest-facing service actually
    // included should count — not a building's own front-desk "concierge"
    // staff (buildingFacilities) and not a note saying transfers are NOT
    // provided (serviceExceptions).
    var transferRaw = (identityText + " " + apt.overview + " " + (apt.servicesIncluded || []).join(" ")).toLowerCase();

    var extra = [];
    SYNONYM_TRIGGERS.forEach(function (s) {
      if (s.rx.test(positiveParts)) extra = extra.concat(s.add);
    });

    var tokens = tokenize(positiveParts + " " + extra.join(" "));
    return { tokens: tokens, tokenSet: new Set(tokens), raw: positiveParts.toLowerCase(), amenityRaw: amenityRaw, transferRaw: transferRaw };
  }

  APARTMENTS.forEach(function (apt) { apt._search = buildSearchable(apt); });

  function matchesQuery(apt, query) {
    var q = query.trim().toLowerCase();
    if (!q) return true;
    var qTokens = tokenize(q);
    if (qTokens.length === 0) return true;
    return qTokens.every(function (qt) {
      for (var t of apt._search.tokenSet) {
        if (t === qt || (qt.length >= 2 && t.indexOf(qt) === 0)) return true;
      }
      return false;
    });
  }

  /* ---------------- filters ---------------- */
  var FILTERS = [
    { id: "ps5", label: "PS5 gaming", test: function (a) { return a._search.raw.indexOf("ps5") !== -1; } },
    { id: "atmos", label: "Dolby Atmos sound", test: function (a) { return a._search.raw.indexOf("atmos") !== -1; } },
    { id: "view", label: "Sea / city view", test: function (a) { return /\bsea\b/.test(a._search.raw) && /view/.test(a._search.raw); } },
    { id: "balcony", label: "Balcony / terrace", test: function (a) { return /balcony|terrace/.test(a._search.amenityRaw); } },
    { id: "pool", label: "Swimming pool", test: function (a) { return /\bpool\b/.test(a._search.raw); } },
    { id: "gym", label: "Gym access", test: function (a) { return /\bgym\b/.test(a._search.raw); } },
    { id: "parking", label: "Parking", test: function (a) { return /parking/.test(a._search.raw); } },
    { id: "coffee", label: "Coffee machine", test: function (a) { return /nespresso|espresso/.test(a._search.raw); } },
    { id: "purifier", label: "Air purifier", test: function (a) { return /air purifier/.test(a._search.raw); } },
    { id: "diffuser", label: "Fragrance diffuser", test: function (a) { return /vranjes/.test(a._search.raw); } },
    { id: "concierge", label: "Concierge / transfers", test: function (a) { return /taxi pickup|airport transfer/.test(a._search.transferRaw); } },
    { id: "hue", label: "Smart mood lighting", test: function (a) { return /philips hue/.test(a._search.raw); } }
  ];

  /* ---------------- glossary matching ---------------- */
  function findGlossaryMatch(text) {
    var lower = text.toLowerCase();
    for (var g of GLOSSARY) {
      var matches = g.match || [g.term.toLowerCase()];
      for (var m of matches) {
        if (lower.indexOf(m) !== -1) return g;
      }
    }
    return null;
  }

  /* ---------------- state ---------------- */
  var state = {
    view: "home",     // home | detail | compare
    aptId: null,
    query: "",
    activeFilters: new Set()
  };

  function restoreHomeState() {
    var saved = sessionGet("hbs_home_state", null);
    if (saved) {
      state.query = saved.query || "";
      state.activeFilters = new Set(saved.filters || []);
    }
  }
  function persistHomeState(scrollY) {
    sessionSet("hbs_home_state", {
      query: state.query,
      filters: Array.from(state.activeFilters),
      scrollY: typeof scrollY === "number" ? scrollY : window.scrollY
    });
  }

  /* ---------------- routing ---------------- */
  function parseHash() {
    var h = window.location.hash.replace(/^#\/?/, "");
    if (!h) return { view: "home" };
    var parts = h.split("/");
    if (parts[0] === "apt" && parts[1]) return { view: "detail", aptId: decodeURIComponent(parts[1]) };
    if (parts[0] === "compare") return { view: "compare" };
    return { view: "home" };
  }

  function navigate(hash) {
    window.location.hash = hash;
  }

  window.addEventListener("hashchange", function () {
    applyRoute();
  });

  function applyRoute() {
    var route = parseHash();
    if (state.view === "detail" && route.view !== "detail") {
      // leaving a detail page — nothing special, home state was persisted on entry
    }
    if (route.view === "detail" && APT_BY_ID[route.aptId]) {
      state.view = "detail";
      state.aptId = route.aptId;
      pushRecent(route.aptId);
      saveRecents();
      renderDetail(APT_BY_ID[route.aptId]);
      window.scrollTo(0, 0);
    } else if (route.view === "compare") {
      state.view = "compare";
      renderCompareView();
      window.scrollTo(0, 0);
    } else {
      state.view = "home";
      restoreHomeState();
      renderHome();
      var saved = sessionGet("hbs_home_state", null);
      if (saved && typeof saved.scrollY === "number") {
        requestAnimationFrame(function () { window.scrollTo(0, saved.scrollY); });
      }
    }
    renderCompareBar();
  }

  /* ---------------- toast ---------------- */
  var toastTimer = null;
  function showToast(msg) {
    var el = document.getElementById("toast");
    el.innerHTML = '<svg><use href="#i-check"/></svg>' + escapeHtml(msg);
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  /* ---------------- helpers ---------------- */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderFeatureLine(text) {
    var g = findGlossaryMatch(text);
    var infoBtn = g ? ' <button class="info-btn" type="button" data-gloss="' + g.id + '" aria-label="Explain ' + escapeHtml(g.term) + ' to a guest" title="Explain to a guest"><svg width="12" height="12"><use href="#i-info"/></svg>Explain to guest</button>' : "";
    var explain = g ? '<div class="feat-explain"><span class="feat-explain-label">What this means</span>' + escapeHtml(g.short) + "</div>" : "";
    return '<li class="feat-item"><div class="feat-main"><span class="feat-text-row"><span class="feat-text">' + escapeHtml(text) + "</span>" + infoBtn + "</span>" + explain + "</div></li>";
  }

  function featList(items) {
    if (!items || !items.length) return "";
    return '<ul class="feat-list">' + items.map(renderFeatureLine).join("") + "</ul>";
  }

  function aptLabel(apt) {
    return BUILDING_BY_ID[apt.buildingId].name + " — " + apt.number;
  }

  /* ============================================================
     RENDER: HOME
     ============================================================ */
  function renderHome() {
    var main = document.getElementById("main");
    var filtered = APARTMENTS.filter(function (a) {
      if (!matchesQuery(a, state.query)) return false;
      for (var f of state.activeFilters) {
        var def = FILTERS.filter(function (d) { return d.id === f; })[0];
        if (def && !def.test(a)) return false;
      }
      return true;
    });

    var html = "";

    // HERO
    html += '<div class="home-hero">' +
      '<div class="hero-top">' +
      '<div class="hero-logo-row"><div class="hero-logo-box"><svg viewBox="0 0 640 641"><use href="#hbs-logo"/></svg></div>' +
      '<div class="hero-brand-text">Homes <em>by</em> Sujo</div></div>' +
      '<div class="hero-doc-tag"><div class="hero-doc-tag-pill">CO-HOST GUIDE &middot; 38 APARTMENTS</div>' +
      '<span class="hero-doc-tagline">Where Comfort Feels Personal</span></div>' +
      '</div>' +
      '<div class="hero-gold-line"></div>' +
      '<div class="hero-mid">' +
      '<div class="hero-left"><div class="hero-eyebrow">Apartment Directory</div>' +
      '<div class="hero-title">Find the perfect<br><em>match</em> for your guest.</div>' +
      '<div class="hero-subtitle">Search by building, apartment number or equipment, or browse below. Every entry links straight to its Airbnb listing.</div></div>' +
      '<div class="hero-right"><div class="hero-stat-row">' +
      '<div class="hero-stat"><div class="hero-stat-label">Apartments</div><div class="hero-stat-value">38</div><div class="hero-stat-sub">Across the portfolio</div></div>' +
      '<div class="hero-stat"><div class="hero-stat-label">Buildings</div><div class="hero-stat-value">8</div><div class="hero-stat-sub">Towers &amp; residences</div></div>' +
      '<div class="hero-stat"><div class="hero-stat-label">Listings</div><div class="hero-stat-value">Live</div><div class="hero-stat-sub">Direct Airbnb links</div></div>' +
      '</div></div>' +
      '</div></div>';

    html += '<div class="page-panel">';

    // Filter bar
    html += '<div class="filter-bar" role="group" aria-label="Feature filters">';
    FILTERS.forEach(function (f) {
      var active = state.activeFilters.has(f.id);
      html += '<button class="chip' + (active ? " active" : "") + '" data-filter="' + f.id + '" aria-pressed="' + active + '">' +
        escapeHtml(f.label) + (active ? ' <span class="chip-x">&times;</span>' : "") + "</button>";
    });
    if (state.query || state.activeFilters.size) {
      html += '<button class="reset-btn" id="resetBtn">Reset search &amp; filters</button>';
    }
    html += '<span class="result-count">' + filtered.length + " of " + APARTMENTS.length + " apartments</span>";
    html += "</div>";

    var isFiltering = !!(state.query || state.activeFilters.size);

    // Favourites strip
    if (!isFiltering && favourites.length) {
      var favApts = favourites.map(function (id) { return APT_BY_ID[id]; }).filter(Boolean);
      if (favApts.length) {
        html += '<div class="section"><div class="section-title"><h2>Favourites</h2></div>';
        html += '<div class="strip">' + favApts.map(renderMiniCard).join("") + "</div></div>";
      }
    }

    // Recently viewed strip
    if (!isFiltering && recents.length) {
      var recApts = recents.map(function (id) { return APT_BY_ID[id]; }).filter(Boolean).slice(0, 6);
      if (recApts.length) {
        html += '<div class="section"><div class="section-title"><h2>Recently viewed</h2></div>';
        html += '<div class="strip">' + recApts.map(renderMiniCard).join("") + "</div></div>";
      }
    }

    // Results
    if (!filtered.length) {
      html += '<div class="no-results"><svg><use href="#i-search"/></svg>' +
        "<h3>No apartments match that search</h3>" +
        "<p>Try a different building name, apartment number, or equipment term — or reset your filters.</p>" +
        '<button class="reset-btn" id="resetBtn2">Reset search &amp; filters</button></div>';
    } else if (isFiltering) {
      html += '<div class="section"><div class="grid">' + filtered.map(renderCard).join("") + "</div></div>";
    } else {
      BUILDINGS.forEach(function (b) {
        var apts = filtered.filter(function (a) { return a.buildingId === b.id; });
        if (!apts.length) return;
        html += '<div class="building-group"><div class="building-head phase-label"><h2>' + escapeHtml(b.name) + '</h2><span class="count">' + apts.length + (apts.length === 1 ? " apartment" : " apartments") + "</span></div>";
        html += '<div class="grid">' + apts.map(renderCard).join("") + "</div></div>";
      });
    }

    html += "</div>"; // close page-panel

    html += '<div class="closing">' +
      '<div class="closing-eyebrow">Homes by Sujo</div>' +
      '<div class="closing-title">Every guest deserves excellence.</div>' +
      '<div class="closing-body">A daily reference built for co-hosts — accurate apartment details, quick equipment explanations, and a direct line to every Airbnb listing.</div>' +
      '<div class="closing-brand"><svg viewBox="0 0 640 641"><use href="#hbs-logo"/></svg>' +
      '<span>Homes <em style="font-style:italic;opacity:.7;">by</em> <span class="accent">Sujo</span></span>&nbsp;&middot;&nbsp;Co-Host Apartment Guide' +
      "</div></div>";

    main.innerHTML = html;
    wireHomeEvents();
  }

  function renderCard(apt) {
    var b = BUILDING_BY_ID[apt.buildingId];
    var fav = isFavourite(apt.id);
    var cmp = isInCompare(apt.id);
    var badges = [];
    if (apt._search.raw.indexOf("ps5") !== -1) badges.push("PS5");
    if (apt._search.raw.indexOf("atmos") !== -1) badges.push("Atmos");
    if (/\bpool\b/.test(apt._search.raw)) badges.push("Pool");
    if (/balcony|terrace/.test(apt._search.amenityRaw)) badges.push("Balcony");
    return '<a class="card" href="#/apt/' + encodeURIComponent(apt.id) + '" data-id="' + apt.id + '">' +
      '<button class="compare-check' + (cmp ? " active" : "") + '" data-compare="' + apt.id + '" aria-pressed="' + cmp + '" aria-label="Add ' + escapeHtml(aptLabel(apt)) + ' to compare"><svg width="13" height="13"><use href="#i-scale"/></svg>' + (cmp ? "Added" : "Compare") + "</button>" +
      '<div class="card-top"><div><div class="card-building">' + escapeHtml(b.name) + '</div><div class="card-title">' + escapeHtml(apt.number) + "</div></div>" +
      '<button class="fav-btn' + (fav ? " active" : "") + '" data-fav="' + apt.id + '" aria-pressed="' + fav + '" aria-label="' + (fav ? "Remove from" : "Add to") + ' favourites"><svg><use href="#' + (fav ? "i-star" : "i-star-o") + '"/></svg></button></div>' +
      '<div class="card-overview">' + escapeHtml(apt.overview) + "</div>" +
      (badges.length ? '<div class="card-tags">' + badges.map(function (t) { return '<span class="tag-pill">' + t + "</span>"; }).join("") + "</div>" : "") +
      "</a>";
  }

  function renderMiniCard(apt) {
    var b = BUILDING_BY_ID[apt.buildingId];
    return '<a class="mini-card" href="#/apt/' + encodeURIComponent(apt.id) + '">' +
      '<div class="card-building">' + escapeHtml(b.name) + '</div><div class="card-title">' + escapeHtml(apt.number) + "</div></a>";
  }

  function wireHomeEvents() {
    var input = document.getElementById("searchInput");
    input.value = state.query;
    toggleSearchClear();

    document.querySelectorAll("[data-filter]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-filter");
        if (state.activeFilters.has(id)) state.activeFilters.delete(id); else state.activeFilters.add(id);
        persistHomeState();
        renderHome();
      });
    });

    var resetBtns = [document.getElementById("resetBtn"), document.getElementById("resetBtn2")].filter(Boolean);
    resetBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.query = "";
        state.activeFilters = new Set();
        persistHomeState(0);
        renderHome();
        document.getElementById("searchInput").focus();
      });
    });

    document.querySelectorAll("[data-fav]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        var id = btn.getAttribute("data-fav");
        toggleFavourite(id);
        renderHome();
      });
    });

    document.querySelectorAll("[data-compare]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        var id = btn.getAttribute("data-compare");
        toggleCompare(id);
        renderHome();
      });
    });

    document.querySelectorAll(".card, .mini-card").forEach(function (card) {
      card.addEventListener("click", function () {
        persistHomeState();
      });
    });
  }

  /* ============================================================
     RENDER: APARTMENT DETAIL
     ============================================================ */
  function renderDetail(apt) {
    var main = document.getElementById("main");
    var b = BUILDING_BY_ID[apt.buildingId];
    var fav = isFavourite(apt.id);
    var cmp = isInCompare(apt.id);

    var html = "";
    html += '<div class="back-row"><button class="back-link" id="backBtn"><svg><use href="#i-arrow-left"/></svg>Back to all apartments</button></div>';

    html += '<div class="detail-hero"><div class="detail-hero-main">' +
      '<div class="detail-building">' + escapeHtml(b.name) + '</div>' +
      "<h1>Apartment " + escapeHtml(apt.number) + "</h1>" +
      '<p class="detail-overview">' + escapeHtml(apt.overview) + "</p>";
    if (apt.quickFacts && apt.quickFacts.length) {
      html += '<div class="detail-quickfacts">' + apt.quickFacts.map(function (q) { return '<span class="qf-pill">' + escapeHtml(q) + "</span>"; }).join("") + "</div>";
    }
    html += "</div>";

    html += '<div class="detail-actions">' +
      '<a class="airbnb-btn" href="' + apt.airbnb + '" target="_blank" rel="noopener noreferrer"><svg><use href="#i-airbnb"/></svg>Open Airbnb listing</a>' +
      '<div class="hero-secondary">' +
      '<button class="ghost-btn' + (fav ? " on" : "") + '" id="favBtn"><svg><use href="#' + (fav ? "i-star" : "i-star-o") + '"/></svg>' + (fav ? "Favourited" : "Favourite") + "</button>" +
      '<button class="ghost-btn' + (cmp ? " on" : "") + '" id="cmpBtn"><svg><use href="#i-scale"/></svg>' + (cmp ? "In compare" : "Compare") + "</button>" +
      '<button class="ghost-btn" id="copyBtn"><svg><use href="#i-copy"/></svg>Copy guest summary</button>' +
      "</div></div></div>";

    html += '<div class="detail-page-panel"><div class="detail-grid">';

    // Living room & entertainment (TVs + sound/gaming/entertainment combined — it's all the same room's setup)
    html += '<div class="panel wide"><h3><span class="icon-box"><svg><use href="#i-tv"/></svg></span>Living room &amp; entertainment</h3><div class="tv-pair">' +
      '<div class="tv-slot' + (apt.tv.livingRoom ? "" : " empty") + '"><div class="tv-label">Living room TV</div><div class="tv-value">' + escapeHtml(apt.tv.livingRoom || "Not itemised in the source guide") + "</div></div>" +
      '<div class="tv-slot' + (apt.tv.bedroom ? "" : " empty") + '"><div class="tv-label">Bedroom TV</div><div class="tv-value">' + escapeHtml(apt.tv.bedroom || "Not itemised in the source guide") + "</div></div>" +
      "</div>" +
      (apt.entertainment && apt.entertainment.length ? '<div style="margin-top:14px;">' + featList(apt.entertainment) + "</div>" : "") +
      (apt.checkIn ? '<div class="notice-box"><svg><use href="#i-check"/></svg><span><strong>Check-in:</strong> ' + escapeHtml(apt.checkIn) + "</span></div>" : "") +
      "</div>";

    // Kitchen & coffee
    html += '<div class="panel"><h3><span class="icon-box"><svg><use href="#i-coffee"/></svg></span>Kitchen &amp; coffee</h3>' +
      (apt.kitchenCoffee && apt.kitchenCoffee.length ? featList(apt.kitchenCoffee) : '<p class="empty-hint">Not itemised in the source guide.</p>') +
      "</div>";

    // Bedroom / bathroom / laundry
    html += '<div class="panel"><h3><span class="icon-box"><svg><use href="#i-bed"/></svg></span>Bedroom, bathroom &amp; laundry</h3>' +
      (apt.bedroomBathroomLaundry && apt.bedroomBathroomLaundry.length ? featList(apt.bedroomBathroomLaundry) : '<p class="empty-hint">Not itemised in the source guide.</p>') +
      "</div>";

    // Lighting & comfort
    html += '<div class="panel"><h3><span class="icon-box"><svg><use href="#i-bulb"/></svg></span>Lighting &amp; comfort</h3>' +
      (apt.lightingComfort && apt.lightingComfort.length ? featList(apt.lightingComfort) : '<p class="empty-hint">Not itemised in the source guide.</p>') +
      "</div>";

    // Building facilities
    html += '<div class="panel"><h3><span class="icon-box"><svg><use href="#i-building"/></svg></span>Building facilities</h3>' +
      (apt.buildingFacilities && apt.buildingFacilities.length ? '<div class="chips-inline">' + apt.buildingFacilities.map(function (t) { return '<span class="tag-pill">' + escapeHtml(t) + "</span>"; }).join("") + "</div>" : '<p class="empty-hint">Not itemised in the source guide.</p>') +
      "</div>";

    // Services & exceptions (wide)
    var hasServices = (apt.servicesIncluded && apt.servicesIncluded.length) || (apt.serviceExceptions && apt.serviceExceptions.length) || (apt.guestNotes && apt.guestNotes.length);
    if (hasServices) {
      html += '<div class="panel wide"><h3><span class="icon-box"><svg><use href="#i-info"/></svg></span>Included services &amp; things to know</h3>';
      if (apt.servicesIncluded && apt.servicesIncluded.length) {
        html += featList(apt.servicesIncluded);
      }
      if (apt.serviceExceptions && apt.serviceExceptions.length) {
        apt.serviceExceptions.forEach(function (ex) {
          html += '<div class="notice-box exception"><svg><use href="#i-alert"/></svg><span>' + escapeHtml(ex) + "</span></div>";
        });
      }
      if (apt.guestNotes && apt.guestNotes.length) {
        html += '<div style="margin-top:12px;">' + featList(apt.guestNotes) + "</div>";
      }
      html += "</div>";
    }

    // Gaps — honestly flagged, visually distinct
    if (apt.gaps && apt.gaps.length) {
      html += '<div class="panel wide"><h3><span class="icon-box"><svg><use href="#i-clock"/></svg></span>Not yet confirmed</h3>';
      apt.gaps.forEach(function (g) {
        html += '<div class="notice-box warn"><svg><use href="#i-alert"/></svg><span>' + escapeHtml(g) + "</span></div>";
      });
      html += "</div>";
    }

    html += "</div></div>"; // detail-grid + detail-page-panel

    main.innerHTML = html;
    wireDetailEvents(apt);
  }

  function wireDetailEvents(apt) {
    document.getElementById("backBtn").addEventListener("click", function () {
      navigate("#/");
    });
    document.getElementById("favBtn").addEventListener("click", function () {
      toggleFavourite(apt.id);
      renderDetail(apt);
    });
    document.getElementById("cmpBtn").addEventListener("click", function () {
      toggleCompare(apt.id);
      renderDetail(apt);
    });
    document.getElementById("copyBtn").addEventListener("click", function () {
      copyGuestSummary(apt);
    });
    document.querySelectorAll("[data-gloss]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        openGlossaryPopover(btn.getAttribute("data-gloss"), btn);
      });
    });
  }

  // Title-Case a line the same way the page's own CSS does (text-transform:
  // capitalize): uppercase just the first letter of each word, leave the
  // rest of the word untouched, so brand names/initialisms are unaffected.
  function titleCaseLine(s) {
    return s.replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  function copyGuestSummary(apt) {
    var b = BUILDING_BY_ID[apt.buildingId];
    var lines = [];
    lines.push("Homes by Sujo — " + b.name + " " + apt.number);
    lines.push(apt.overview);
    lines.push("");
    if (apt.tv.livingRoom || apt.tv.bedroom) {
      lines.push("TVs:");
      if (apt.tv.livingRoom) lines.push("- Living room: " + apt.tv.livingRoom);
      if (apt.tv.bedroom) lines.push("- Bedroom: " + apt.tv.bedroom);
      lines.push("");
    }
    if (apt.entertainment && apt.entertainment.length) {
      lines.push("Entertainment:");
      apt.entertainment.forEach(function (i) { lines.push("- " + i); });
      lines.push("");
    }
    if (apt.kitchenCoffee && apt.kitchenCoffee.length) {
      lines.push("Kitchen & coffee:");
      apt.kitchenCoffee.forEach(function (i) { lines.push("- " + i); });
      lines.push("");
    }
    if (apt.buildingFacilities && apt.buildingFacilities.length) {
      lines.push("Building facilities: " + apt.buildingFacilities.join(", "));
      lines.push("");
    }
    if (apt.serviceExceptions && apt.serviceExceptions.length) {
      lines.push("Please note: " + apt.serviceExceptions.join(" "));
      lines.push("");
    }
    // Title-Case every line except the one carrying the Airbnb URL — a URL's
    // path is case-sensitive, so it must be copied exactly as stored.
    var text = lines.map(function (line) {
      return line ? titleCaseLine(line) : line;
    }).concat([titleCaseLine("Airbnb listing: ") + apt.airbnb]).join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("Guest summary copied");
      }).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("Guest summary copied");
    } catch (e) {
      showToast("Copy failed — please select the text manually");
    }
  }

  /* ============================================================
     GLOSSARY POPOVER + MODAL
     ============================================================ */
  function openGlossaryPopover(id, anchorEl) {
    var g = GLOSSARY.filter(function (x) { return x.id === id; })[0];
    if (!g) return;
    closePopover();
    var rect = anchorEl.getBoundingClientRect();
    var slot = document.getElementById("popoverSlot");
    var backdrop = document.createElement("div");
    backdrop.className = "popover-backdrop";
    backdrop.addEventListener("click", closePopover);

    var pop = document.createElement("div");
    pop.className = "popover";
    pop.setAttribute("role", "dialog");
    pop.setAttribute("aria-label", g.term);
    var top = Math.min(rect.bottom + 8, window.innerHeight - 220);
    var left = Math.min(rect.left, window.innerWidth - 360);
    pop.style.top = Math.max(8, top) + "px";
    pop.style.left = Math.max(8, left) + "px";

    var body = '<button class="close-x" aria-label="Close">&times;</button>' +
      '<div class="popover-head"><span class="popover-icon">i</span><div><div class="kind">' + escapeHtml(g.kind) + '</div><h4>' + escapeHtml(g.term) + "</h4></div></div>" +
      '<div class="popover-msg">' + escapeHtml(g.guestLine || g.short);
    if (g.example) body += '<span class="ex">Example: ' + escapeHtml(g.example) + "</span>";
    if (g.caveat) body += '<span class="caveat">' + escapeHtml(g.caveat) + "</span>";
    if (g.source) body += '<span class="caveat"><a href="' + g.source + '" target="_blank" rel="noopener noreferrer">Source ↗</a></span>';
    body += "</div>";
    pop.innerHTML = body;

    slot.appendChild(backdrop);
    slot.appendChild(pop);
    pop.querySelector(".close-x").addEventListener("click", closePopover);
    document.addEventListener("keydown", escCloseOnce);
    pop.querySelector(".close-x").focus();
  }
  function escCloseOnce(e) { if (e.key === "Escape") closePopover(); }
  function closePopover() {
    document.getElementById("popoverSlot").innerHTML = "";
    document.removeEventListener("keydown", escCloseOnce);
  }

  function openGlossaryModal() {
    var slot = document.getElementById("modalSlot");
    function draw(filterText) {
      var q = (filterText || "").toLowerCase();
      var list = GLOSSARY.filter(function (g) {
        return !q || g.term.toLowerCase().indexOf(q) !== -1 || g.short.toLowerCase().indexOf(q) !== -1 || g.kind.toLowerCase().indexOf(q) !== -1;
      });
      var body = '<div class="modal-backdrop" id="glossBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="glossTitle">' +
        '<div class="modal-head"><h2 id="glossTitle">Equipment glossary</h2><button class="modal-close" id="glossClose" aria-label="Close">&times;</button></div>' +
        '<p class="lead">Quick, guest-friendly explanations for the equipment mentioned across apartments.</p>' +
        '<div class="glossary-search"><svg><use href="#i-search"/></svg><input id="glossSearchInput" placeholder="Search the glossary…" value="' + escapeHtml(filterText || "") + '"></div>' +
        '<div class="glossary-list">' +
        (list.length ? list.map(function (g) {
          return '<div class="gloss-entry"><div class="gloss-head"><div class="kind">' + escapeHtml(g.kind) + '</div><h4>' + escapeHtml(g.term) + "</h4></div>" +
            '<div class="gloss-body">' + escapeHtml(g.guestLine || g.short) +
            (g.example ? " Example: " + escapeHtml(g.example) : "") + "</div></div>";
        }).join("") : '<p class="empty-hint">No glossary terms match that search.</p>') +
        "</div></div></div>";
      slot.innerHTML = body;
      document.getElementById("glossClose").addEventListener("click", closeModal);
      document.getElementById("glossBackdrop").addEventListener("click", function (e) { if (e.target.id === "glossBackdrop") closeModal(); });
      var input = document.getElementById("glossSearchInput");
      input.addEventListener("input", function () { draw(input.value); input.focus(); input.setSelectionRange(input.value.length, input.value.length); });
      document.addEventListener("keydown", escCloseModalOnce);
    }
    draw("");
  }
  function escCloseModalOnce(e) { if (e.key === "Escape") closeModal(); }
  function closeModal() {
    document.getElementById("modalSlot").innerHTML = "";
    document.removeEventListener("keydown", escCloseModalOnce);
  }

  /* ============================================================
     COMPARE BAR + VIEW
     ============================================================ */
  function renderCompareBar() {
    var slot = document.getElementById("compareBarSlot");
    var badge = document.getElementById("compareCount");
    badge.textContent = compareList.length;
    badge.hidden = compareList.length === 0;

    if (!compareList.length || state.view === "compare") { slot.innerHTML = ""; return; }
    var apts = compareList.map(function (id) { return APT_BY_ID[id]; }).filter(Boolean);
    var html = '<div class="compare-bar"><div class="compare-bar-inner">' +
      '<div class="compare-slots">' + apts.map(function (a) {
        return '<span class="compare-slot">' + escapeHtml(aptLabel(a)) + ' <button data-remove="' + a.id + '" aria-label="Remove ' + escapeHtml(aptLabel(a)) + ' from compare">&times;</button></span>';
      }).join("") + "</div>" +
      '<button class="compare-cancel" id="clearCompare">Clear</button>' +
      '<button class="compare-cta" id="goCompare" ' + (apts.length < 2 ? "disabled" : "") + ">Compare " + apts.length + " apartment" + (apts.length === 1 ? "" : "s") + "</button>" +
      "</div></div>";
    slot.innerHTML = html;
    document.querySelectorAll("[data-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        toggleCompare(btn.getAttribute("data-remove"));
        if (state.view === "home") renderHome();
        if (state.view === "detail") renderDetail(APT_BY_ID[state.aptId]);
      });
    });
    document.getElementById("clearCompare").addEventListener("click", function () {
      compareList = []; saveCompare(); renderCompareBar();
      if (state.view === "home") renderHome();
      if (state.view === "detail") renderDetail(APT_BY_ID[state.aptId]);
    });
    document.getElementById("goCompare").addEventListener("click", function () {
      if (apts.length >= 2) navigate("#/compare");
    });
  }

  var COMPARE_ROWS = [
    { label: "Building", get: function (a) { return BUILDING_BY_ID[a.buildingId].name; } },
    { label: "Overview", get: function (a) { return a.overview; } },
    { label: "Living-room TV", get: function (a) { return a.tv.livingRoom || "—"; } },
    { label: "Bedroom TV", get: function (a) { return a.tv.bedroom || "—"; } },
    { label: "Entertainment", get: function (a) { return (a.entertainment || []); }, list: true },
    { label: "Kitchen & coffee", get: function (a) { return (a.kitchenCoffee || []); }, list: true },
    { label: "Lighting & comfort", get: function (a) { return (a.lightingComfort || []); }, list: true },
    { label: "Building facilities", get: function (a) { return (a.buildingFacilities || []); }, list: true },
    { label: "Included services", get: function (a) { return (a.servicesIncluded || []); }, list: true },
    { label: "Exceptions", get: function (a) { return (a.serviceExceptions || []); }, list: true },
    { label: "Check-in", get: function (a) { return a.checkIn || "—"; } },
    { label: "Airbnb listing", get: function (a) { return a.airbnb; }, link: true }
  ];

  function renderCompareView() {
    var main = document.getElementById("main");
    var apts = compareList.map(function (id) { return APT_BY_ID[id]; }).filter(Boolean);
    var html = '<div class="back-row"><button class="back-link" id="backBtn"><svg><use href="#i-arrow-left"/></svg>Back to all apartments</button></div>';
    html += '<div class="home-head"><h1>Compare apartments</h1><p>Meaningful differences are highlighted.</p></div>';

    if (apts.length < 2) {
      html += '<div class="no-results"><svg><use href="#i-scale"/></svg><h3>Add at least two apartments</h3><p>Use the compare button on an apartment card or page, then come back here.</p></div>';
      main.innerHTML = html;
      document.getElementById("backBtn").addEventListener("click", function () { navigate("#/"); });
      return;
    }

    html += '<div class="compare-table-wrap"><table class="compare-table"><thead><tr><th>&nbsp;</th>' +
      apts.map(function (a) { return "<th>" + escapeHtml(aptLabel(a)) + "</th>"; }).join("") + "</tr></thead><tbody>";

    COMPARE_ROWS.forEach(function (row) {
      var values = apts.map(function (a) { return row.get(a); });
      var serialized = values.map(function (v) { return row.list ? v.join("|") : v; });
      var differs = new Set(serialized).size > 1;
      html += "<tr" + (differs ? ' class="diff"' : "") + '><td class="row-label">' + escapeHtml(row.label) + "</td>";
      values.forEach(function (v) {
        if (row.link) {
          html += '<td><a href="' + v + '" target="_blank" rel="noopener noreferrer">Open listing ↗</a></td>';
        } else if (row.list) {
          html += "<td>" + (v.length ? "<ul>" + v.map(function (i) { return "<li>" + escapeHtml(i) + "</li>"; }).join("") + "</ul>" : '<span class="empty-hint">—</span>') + "</td>";
        } else {
          html += "<td>" + escapeHtml(v) + "</td>";
        }
      });
      html += "</tr>";
    });

    html += "</tbody></table></div>";
    html += '<div style="margin-top:16px;"><button class="reset-btn" id="clearCompareView">Clear comparison</button></div>';

    main.innerHTML = html;
    document.getElementById("backBtn").addEventListener("click", function () { navigate("#/"); });
    document.getElementById("clearCompareView").addEventListener("click", function () {
      compareList = []; saveCompare(); navigate("#/");
    });
  }

  /* ============================================================
     GLOBAL SEARCH WIRING
     ============================================================ */
  function toggleSearchClear() {
    var btn = document.getElementById("searchClearBtn");
    if (state.query) btn.classList.remove("visually-hidden"); else btn.classList.add("visually-hidden");
  }

  var searchDebounce = null;
  document.addEventListener("DOMContentLoaded", init);

  function init() {
    var input = document.getElementById("searchInput");
    input.addEventListener("input", function () {
      state.query = input.value;
      toggleSearchClear();
      if (state.view !== "home") { navigate("#/"); return; }
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(function () {
        persistHomeState(0);
        renderHome();
        document.getElementById("searchInput").focus();
        document.getElementById("searchInput").setSelectionRange(input.value.length, input.value.length);
      }, 80);
    });
    document.getElementById("searchClearBtn").addEventListener("click", function () {
      state.query = "";
      input.value = "";
      toggleSearchClear();
      persistHomeState(0);
      if (state.view === "home") renderHome();
      input.focus();
    });
    document.getElementById("brandHome").addEventListener("click", function () { navigate("#/"); });
    document.getElementById("glossaryBtn").addEventListener("click", openGlossaryModal);
    document.getElementById("compareBtn").addEventListener("click", function () {
      if (compareList.length >= 2) navigate("#/compare");
      else showToast("Add at least two apartments to compare");
    });

    restoreHomeState();
    applyRoute();
  }
})();

</script>
